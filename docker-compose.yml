services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shield
      POSTGRES_PASSWORD: shield
      POSTGRES_DB: shield
    ports:
      # Host port 5433 avoids clashing with a locally installed Postgres on
      # the default 5432. The backend container always talks to this
      # service over the internal network at postgres:5432 regardless.
      - '5433:5432'
    volumes:
      - shield_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shield']
      interval: 5s
      timeout: 5s
      retries: 10

  nudenet:
    build:
      context: ./nudenet-service
    restart: unless-stopped
    ports:
      - '8000:8000'
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://localhost:8000/health")']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  pdf-redact:
    build:
      context: ./pdf-redact-service
    restart: unless-stopped
    ports:
      - '8001:8001'
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://localhost:8001/health")']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      nudenet:
        condition: service_healthy
      pdf-redact:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      # Overrides for values that must point at the compose network rather
      # than whatever backend/.env has for bare-metal local development.
      DATABASE_URL: postgres://shield:shield@postgres:5432/shield?sslmode=disable
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      NUDENET_SERVICE_URL: http://nudenet:8000
      PDF_REDACT_SERVICE_URL: http://pdf-redact:8001
    ports:
      - '8080:8080'

volumes:
  shield_postgres_data:
